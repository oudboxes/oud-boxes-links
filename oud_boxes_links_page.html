<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <title>OUD BOXES | صناديق العود</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 18px; color: #f8f3e8;
      font-family: Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at top, #3a2b18 0%, #17130e 48%, #090909 100%);
    }
    main {
      width: min(100%, 430px); padding: 38px 25px 30px;
      text-align: center; border: 1px solid #9b7944; border-radius: 24px;
      background: linear-gradient(160deg, rgba(35,29,21,.97), rgba(12,12,12,.98));
      box-shadow: 0 20px 60px #0009;
    }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 18px; display: grid;
      place-items: center; border: 1px solid #c5a36a; border-radius: 50%;
      color: #d9bd88; font-size: 25px; letter-spacing: 2px;
    }
    h1 { margin: 0; color: #e4c894; font-size: 27px; letter-spacing: 2px; }
    .arabic { margin: 9px 0 8px; font-size: 18px; color: #f5ead6; }
    .intro { margin: 0 0 27px; color: #c5bba9; font-size: 14px; line-height: 1.8; }
    .links { display: grid; gap: 13px; }
    a {
      min-height: 58px; display: flex; align-items: center; justify-content: center;
      gap: 11px; padding: 14px 18px; border-radius: 13px;
      text-decoration: none; font-size: 16px; font-weight: bold;
      transition: transform .15s ease, filter .15s ease;
    }
    a:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .shop { color: #17120b; background: linear-gradient(100deg, #d9bd88, #b58a4e); }
    .snap { color: #17130b; background: #f4df55; }
    .tiktok { color: #fff; background: #252525; border: 1px solid #555; }
    .icon { font-size: 20px; }
    footer { margin-top: 25px; color: #8f8575; font-size: 11px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">OB</div>
    <h1>OUD BOXES</h1>
    <div class="arabic">صناديق العود</div>
    <p class="intro">يسعدنا تواصلكم ومتابعتنا<br>اختاروا وجهتكم من الروابط التالية</p>
    <nav class="links" aria-label="روابط صناديق العود">
      <a class="shop" href="https://oud-boxes.com/" target="_blank" rel="noopener noreferrer">
        <span class="icon">🛍️</span> زيارة المتجر الإلكتروني
      </a>
      <a class="snap" href="https://snapchat.com/t/1yKL7aUQ" target="_blank" rel="noopener noreferrer">
        <span class="icon">👻</span> تابعونا على سناب شات
      </a>
      <a class="tiktok" href="https://www.tiktok.com/@oudboxes?_r=1&_t=ZS-99uoDGwFVoH" target="_blank" rel="noopener noreferrer">
        <span class="icon">♪</span> تابعونا على تيك توك
      </a>
    </nav>
    <footer>OUD BOXES</footer>
  </main>
</body>
</html>
